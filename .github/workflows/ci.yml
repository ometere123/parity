name: contract-only checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  offline-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install stable dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          npm install --no-audit --no-fund
      - name: Check stable CLI pin and Python syntax
        run: python scripts/preflight.py --offline
      - name: Offline state/consensus tests
        run: python -m pytest tests -q
      - name: GenVM pinned semantic validation
        run: |
          genvm-lint lint contracts/parity.py
          genvm-lint lint contracts/invoice_gate.py
          genvm-lint download --version v0.2.12
          genvm-lint validate contracts/parity.py
          genvm-lint validate contracts/invoice_gate.py
